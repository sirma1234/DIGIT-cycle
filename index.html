        <style>
            :root {
                font-size: 62.5%;
            }

            .boot-splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                border-top: 2px solid #f3e9d2;
                background: #fff;
                color: #111827;
                font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-align: center;
            }

            .boot-splash__center {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .boot-splash__logo-wrap {
                position: relative;
                display: flex;
                width: 160px;
                height: 100px;
                align-items: flex-start;
                justify-content: center;
            }

            .boot-splash__logo-glow {
                position: absolute;
                top: -12px;
                width: 88px;
                height: 88px;
                border-radius: 50%;
                background: rgba(11, 92, 255, .08);
                animation: boot-splash-pulse 1.8s ease-in-out infinite;
            }

            .boot-splash__logo {
                position: relative;
                z-index: 2;
                width: 64px;
                height: 64px;
                border-radius: 50%;
                object-fit: cover;
                box-shadow: 0 6px 18px rgba(11, 92, 255, .3);
            }

            .boot-splash__bars {
                position: absolute;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 1;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                gap: 8px;
            }

            .boot-splash__bars span {
                width: 10px;
                border-radius: 3px;
                background: linear-gradient(180deg, #0b5cff, #00a651);
                opacity: .75;
                animation: boot-splash-bar 1.2s ease-in-out infinite;
            }

            .boot-splash__bars span:nth-child(1) { height: 16px; animation-delay: 0s; }
            .boot-splash__bars span:nth-child(2) { height: 24px; animation-delay: .1s; }
            .boot-splash__bars span:nth-child(3) { height: 14px; animation-delay: .2s; }
            .boot-splash__bars span:nth-child(4) { height: 30px; animation-delay: .3s; }
            .boot-splash__bars span:nth-child(5) { height: 18px; animation-delay: .4s; }
            .boot-splash__bars span:nth-child(6) { height: 40px; animation-delay: .5s; }
            .boot-splash__bars span:nth-child(7) { height: 32px; animation-delay: .6s; }

            .boot-splash__title {
                margin: 24px 0 0;
                color: #111827;
                font-size: 2.2rem;
                font-weight: 900;
                letter-spacing: .18em;
            }

            .boot-splash__tagline {
                margin: 10px 0 0;
                color: #6b7280;
                font-size: 1.1rem;
                font-weight: 600;
                letter-spacing: .16em;
            }

            .boot-splash__track {
                width: 220px;
                height: 4px;
                margin-top: 22px;
                overflow: hidden;
                border-radius: 999px;
                background: #eef0f3;
            }

            .boot-splash__fill {
                width: 32%;
                height: 100%;
                border-radius: 999px;
                background: linear-gradient(90deg, #00a651, #0b5cff);
                animation: boot-splash-progress 2.2s ease-in-out infinite alternate;
            }

            .boot-splash__message {
                margin: 14px 0 0;
                color: #9ca3af;
                font-size: 1.1rem;
                font-weight: 600;
                letter-spacing: .14em;
            }

            @keyframes boot-splash-pulse {
                0%, 100% { transform: scale(1); opacity: .9; }
                50% { transform: scale(1.12); opacity: .5; }
            }

            @keyframes boot-splash-bar {
                0%, 100% { transform: scaleY(1); }
                50% { transform: scaleY(.6); }
            }

            @keyframes boot-splash-progress {
                from { width: 24%; }
                to { width: 82%; }
            }
        </style>

            <div data-boot-fallback class="boot-splash">
                <div class="boot-splash__center">
                    <div class="boot-splash__logo-wrap" aria-hidden="true">
                        <div class="boot-splash__logo-glow"></div>
                        <img class="boot-splash__logo" src="/logo.png" alt="" />
                        <div class="boot-splash__bars">
                            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>

                    <h1 class="boot-splash__title">DIGITTRADER</h1>

                    <div class="boot-splash__track" aria-hidden="true">
                        <div class="boot-splash__fill"></div>
                    </div>
                    <p data-boot-message class="boot-splash__message">LOADING DIGITTRADER...</p>
                    <button
                        data-boot-retry
                        type="button"
                        onclick="window.location.reload()"
                        style="display:none;margin-top:16px;padding:9px 16px;border:1px solid #2ddf8c;border-radius:8px;background:#0c2b2a;color:#d9fff0;cursor:pointer"
                    >
                        Reload preview
                    </button>
                </div>
            </div>
        </div>
        <script>
            (function () {
                var appStarted = false;
                var bootTimer = null;

                function markAppStarted() {
                    appStarted = true;
                    if (bootTimer) window.clearTimeout(bootTimer);
                }

                function showBootError() {
                    if (appStarted) return;
                    var root = document.getElementById('root');
                    var fallback = root && root.querySelector('[data-boot-fallback]');
                    if (!fallback) return;
                    var message = fallback.querySelector('[data-boot-message]');
                    var retry = fallback.querySelector('[data-boot-retry]');
                    if (message) message.textContent = 'The preview could not start. Reload to try again.';
                    if (retry) retry.style.display = 'inline-block';
                }

                function isEntryScript(source) {
                    return (
                        typeof source === 'string' &&
                        (/\/src\/main\.tsx(?:\?|$)/i.test(source) ||
                            /\/assets\/main-[^/]+\.js(?:\?|$)/i.test(source) ||
                            /\/static\/js\/(?:main|index)\.[^/]+\.js(?:\?|$)/i.test(source))
                    );
                }

                window.addEventListener('error', function (event) {
                    var target = event && event.target;
                    var source = target && target.src;
                    var failedEntryScript = target && target.tagName === 'SCRIPT' && isEntryScript(source);
                    if (failedEntryScript) showBootError();
                }, true);

                window.__markMarksyntraderAppStarted = markAppStarted;
                bootTimer = window.setTimeout(function () {
                    if (!appStarted) showBootError();
                }, 15000);
            }());
        </script>
